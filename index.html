<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Weather Control</title>
  <style>
    :root {
      --bg-dark: #0f0f13;
      --panel-bg: rgba(20, 20, 25, 0.9);
      --accent-primary: #00ff88;
      --accent-secondary: #7000ff;
      --text-main: #ffffff;
      --text-dim: #888888;
      --glass: rgba(255, 255, 255, 0.05);
      --danger: #ff5d5d;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .header {
      padding: 20px;
      text-align: center;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--glass);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-tabs {
      display: flex;
      background: var(--panel-bg);
      padding: 10px;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: var(--glass);
      color: var(--text-dim);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active {
      background: var(--accent-primary);
      color: #000;
    }

    .container { padding: 20px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      background: var(--panel-bg);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid var(--glass);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.95);
      background: var(--glass);
    }

    .icon { font-size: 2rem; margin-bottom: 10px; display: block; }
    .label { font-size: 0.9rem; font-weight: 600; }

    .link-box {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      word-break: break-all;
      color: var(--accent-primary);
      margin-bottom: 15px;
      border: 1px solid #333;
    }

    .btn-copy {
      width: 100%;
      padding: 15px;
      background: var(--accent-secondary);
      color: white;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .weather-bg {
      background: linear-gradient(180deg, #2b32b2, #1488cc);
      min-height: 100vh;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 420px;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .temp-big { font-size: 5rem; font-weight: 200; margin: 0; }
    .city { font-size: 2rem; font-weight: 600; margin-bottom: 5px; }
    .time { opacity: 0.8; margin-bottom: 30px; }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .detail {
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 15px;
    }

    .detail-label { font-size: 0.8rem; opacity: 0.7; }
    .detail-val { font-size: 1.2rem; font-weight: bold; }

    .loader { display: none; margin-top: 20px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--glass); font-size: 0.8rem; }
    th { color: var(--accent-primary); }

    .status { margin-top: 12px; color: var(--text-dim); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="tab-dashboard" class="tab-content active">
    <div class="header">
      <h1>Weather Control</h1>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" type="button" onclick="switchTab('dashboard')">Back Door</button>
      <button class="nav-btn" type="button" onclick="switchTab('logs')">Data Logs</button>
    </div>

    <div class="container">
      <div class="grid">
        <div class="card" onclick="generateLink('cam')">
          <span class="icon">📷</span>
          <span class="label">Camera Link</span>
        </div>
        <div class="card" onclick="generateLink('mic')">
          <span class="icon">🎙️</span>
          <span class="label">Mic Link</span>
        </div>
        <div class="card" onclick="generateLink('sms')">
          <span class="icon">💬</span>
          <span class="label">SMS Link</span>
        </div>
        <div class="card" onclick="generateLink('weather')">
          <span class="icon">🌤️</span>
          <span class="label">Weather Link</span>
        </div>
      </div>

      <div style="margin-top: 30px;">
        <p style="color: var(--text-dim); font-size: 0.9rem;">Generated Share Link:</p>
        <div class="link-box" id="outLink">Waiting for selection...</div>
        <button class="btn-copy" type="button" onclick="copyLink()">Copy Link</button>
      </div>

      <div id="logs-section" style="margin-top: 30px; display: none;">
        <h3 style="margin-top: 0;">Victim Data Logs</h3>
        <table id="logTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Action</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3" style="text-align:center;">No data yet...</td></tr>
          </tbody>
        </table>
        <button type="button" onclick="clearLogs()" style="background:transparent; color:var(--danger); border:1px solid var(--danger); padding:10px; margin-top:10px; border-radius:5px; cursor:pointer;">
          Clear Logs
        </button>
      </div>
    </div>
  </div>

  <div id="tab-weather" class="tab-content">
    <div class="weather-bg">
      <div class="weather-card">
        <div class="city" id="wCity">Loading...</div>
        <div class="time" id="wTime">...</div>

        <div class="loader" id="wLoader">
          <div class="spinner"></div>
          <p>Loading Data...</p>
        </div>

        <div id="wContent" style="display:none;">
          <span class="temp-big" id="wTemp">--°</span>
          <p id="wDesc" style="letter-spacing: 2px; text-transform: uppercase;">...</p>

          <div class="details-grid">
            <div class="detail">
              <div class="detail-label">Wind</div>
              <div class="detail-val" id="wWind">--</div>
            </div>
            <div class="detail">
              <div class="detail-label">Humidity</div>
              <div class="detail-val" id="wHum">--</div>
            </div>
          </div>

          <div style="margin-top: 30px; font-size: 0.8rem; opacity: 0.6;">
            Weather Control Service
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    class MockServer {
      constructor() {
        this.logs = JSON.parse(localStorage.getItem('weather_logs')) || [];
      }

      logAction(action, ip) {
        const log = {
          id: Date.now(),
          time: new Date().toLocaleString(),
          action: action,
          ip: ip || '203.0.113.10'
        };
        this.logs.unshift(log);
        localStorage.setItem('weather_logs', JSON.stringify(this.logs));
        return log;
      }

      getLogs() {
        return this.logs;
      }

      clearLogs() {
        this.logs = [];
        localStorage.removeItem('weather_logs');
        renderLogs();
      }
    }

    const api = new MockServer();

    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab-content');
      const buttons = document.querySelectorAll('.nav-btn');

      tabs.forEach(el => el.classList.remove('active'));
      buttons.forEach(el => el.classList.remove('active'));

      if (tab === 'dashboard') {
        document.getElementById('tab-dashboard').classList.add('active');
        buttons[0].classList.add('active');
        document.getElementById('logs-section').style.display = 'none';
        renderLogs();
        return;
      }

      if (tab === 'logs') {
        document.getElementById('tab-dashboard').classList.add('active');
        buttons[1].classList.add('active');
        document.getElementById('logs-section').style.display = 'block';
        renderLogs();
        return;
      }

      if (tab === 'weather') {
        document.getElementById('tab-weather').classList.add('active');
        loadWeather();
      }
    }

    function copyLink() {
      const text = document.getElementById('outLink').textContent.trim();
      if (!text || text === 'Waiting for selection...') {
        alert('No link generated yet.');
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => alert('Link copied!')).catch(() => {
          window.prompt('Copy this link:', text);
        });
      } else {
        window.prompt('Copy this link:', text);
      }
    }

    function clearLogs() {
      if (confirm('Clear all logs?')) {
        api.clearLogs();
      }
    }

    function generateLink(type) {
      const base = window.location.href.split('#')[0];
      const link = `${base}#type=${type}`;
      document.getElementById('outLink').textContent = link;
      api.logAction(type);

      if (type === 'weather') {
        switchTab('weather');
      }

      renderLogs();
    }

    function renderLogs() {
      const tbody = document.querySelector('#logTable tbody');
      const logs = api.getLogs();

      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No data yet...</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(log => `
        <tr>
          <td>${log.time}</td>
          <td><span style="color:var(--accent-primary)">${log.action}</span></td>
          <td>${log.ip}</td>
        </tr>
      `).join('');
    }

    async function loadWeather() {
      const loader = document.getElementById('wLoader');
      const content = document.getElementById('wContent');
      const cityEl = document.getElementById('wCity');
      const timeEl = document.getElementById('wTime');

      loader.style.display = 'block';
      content.style.display = 'none';

      const defaultCoords = { lat: 20.5937, lon: 78.9629, label: 'India' };

      function weatherFromCoords(lat, lon, label) {
        return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`)
          .then(res => res.json())
          .then(data => {
            const current = data.current_weather || {};
            const temp = Math.round(current.temperature ?? 0) + '°';
            const wind = (current.windspeed ?? 0) + ' km/h';
            const humidity = data.current?.relative_humidity ?? '--';
            const descMap = {
              0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
              45: 'Fog', 51: 'Drizzle', 61: 'Rain', 71: 'Snow', 95: 'Thunderstorm'
            };

            document.getElementById('wTemp').innerText = temp;
            document.getElementById('wWind').innerText = wind;
            document.getElementById('wHum').innerText = humidity === '--' ? '--' : humidity + '%';
            document.getElementById('wDesc').innerText = descMap[current.weathercode] || 'Unknown';
            cityEl.innerText = label;
            timeEl.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          });
      }

      try {
        if (navigator.geolocation) {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
          });

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const label = 'Your Location';
          await weatherFromCoords(lat, lon, label);
        } else {
          await weatherFromCoords(defaultCoords.lat, defaultCoords.lon, defaultCoords.label);
        }

        loader.style.display = 'none';
        content.style.display = 'block';
      } catch (err) {
        await weatherFromCoords(defaultCoords.lat, defaultCoords.lon, defaultCoords.label);
        loader.style.display = 'none';
        content.style.display = 'block';
      }
    }

    window.onload = function () {
      renderLogs();
      const hash = window.location.hash;
      if (hash.includes('type=weather')) {
        switchTab('weather');
      }
    };
  </script>
</body>
</html>
